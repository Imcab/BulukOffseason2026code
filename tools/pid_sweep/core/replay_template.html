<title>Replay de PathPlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;700&display=swap">
<style>
/* Layout: visor de simulacion headless. Cabecera compacta, barra de escenarios y reproduccion,
   y un lienzo con un entorno por robot (como la cuadricula de envs de Isaac) o todos
   superpuestos por trayectoria. Un solo look oscuro: alfombra de campo y cinta blanca. */
:root {
  color-scheme: dark;
  --bg: #0e1312;
  --panel: #151c1a;
  --carpet: #19221f;
  --grid: #24302c;
  --line: #2c3935;
  --tape: #d8d2b8;
  --fg: #e7ece9;
  --muted: #93a39d;
  --accent: #e6c34a;
  --accent-ink: #1a1606;
  --ok: #52b4e6;
  --abort: #eaa53c;
  --bad: #f0594b;
  --font-display: "Saira Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 16px; }
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 3.2vw, 34px); letter-spacing: 0.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 72ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
button, select { font: inherit; color: var(--fg); background: var(--carpet); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip { display: inline-flex; gap: 8px; align-items: baseline; }
.chip .kp { font-family: var(--font-mono); font-size: 12px; opacity: 0.8; }
#play { min-width: 92px; font-weight: 600; }
.time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; min-width: 92px; }
input[type="range"] { accent-color: var(--accent); width: min(360px, 60vw); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.stat .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat.ok .v { color: var(--ok); } .stat.abort .v { color: var(--abort); } .stat.bad .v { color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
canvas { display: block; width: 100%; }
.tip { position: absolute; pointer-events: none; z-index: 2; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 210px; box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
.tip h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 15px; font-weight: 700; }
.tip dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 1px 12px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tip dt { color: var(--muted); } .tip dd { margin: 0; text-align: right; }
.state-ok { color: var(--ok); } .state-aborto { color: var(--abort); } .state-inestable { color: var(--bad); }
footer { font-size: 12px; color: var(--muted); max-width: 90ch; }
@media (max-width: 560px) { .time { min-width: 0; } #play { min-width: 0; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">STZ Robotics #3472 · PPHolonomicDriveController</div>
    <h1>Replay de autos con robots aleatorizados</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="bar" role="toolbar" aria-label="Controles">
    <div class="group" id="scenarios" aria-label="Escenario"><span class="label">kP</span></div>
    <div class="group"><span class="label">Vista</span>
      <button id="v-grid" aria-pressed="true">Un entorno por robot</button>
      <button id="v-over" aria-pressed="false">Superpuestos</button>
    </div>
  </div>

  <div class="bar" aria-label="Reproduccion">
    <button id="play" aria-pressed="false">Pausa</button>
    <label class="group"><span class="label">Vel.</span>
      <select id="speed">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
        <option value="1" selected>1x</option><option value="2">2x</option>
      </select>
    </label>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Tiempo">
    <span class="time" id="time">t = 0.00 s</span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="legend">
    <span><i class="sw" style="background:var(--ok)"></i>Siguio el path</span>
    <span><i class="sw" style="background:var(--abort)"></i>Aborto (error &gt; 0.75 m / 45°)</span>
    <span><i class="sw" style="background:var(--bad)"></i>Inestable (diverge u oscila)</span>
    <span><i class="sw" style="background:var(--tape)"></i>Path y pose objetivo</span>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Animacion de los robots"></canvas>
    <div class="tip" id="tip" hidden></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__REPLAY_DATA__*/null;
(function () {
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const COL = { bg: C("--bg"), carpet: C("--carpet"), grid: C("--grid"), line: C("--line"), tape: C("--tape"),
    fg: C("--fg"), muted: C("--muted"), ok: C("--ok"), aborto: C("--abort"), inestable: C("--bad") };
  const STATE_NAME = { ok: "Siguio el path", aborto: "Aborto", inestable: "Inestable" };
  const TRAJ_NAME = {
    mantener_pose: "Mantener pose (prueba de estabilidad)", recta_4m: "Recta 4 m", recta_6m_giro180: "Recta 6 m + giro 180°",
    curva_s_lateral: "Curva en S lateral", diagonal_giro90: "Diagonal + giro 90°", lateral_2m: "Strafe 2 m",
    corto_1m: "Recta corta 1 m", arco_90_giro90: "Arco 90° + giro 90°", giro_sitio_180: "Giro en el lugar 180°" };
  const D = DATA, N = D.robots.length, FDT = D.frame_dt;
  const tEnd = Math.max(...D.trajectories.map(t => t.total_time)) + D.settle_s;
  let sc = 0, view = "grid", t = 1.2, speed = 1, playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let layout = [], hover = -1;

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d"), tip = $("tip"), stage = $("stage");
  $("sub").textContent = `${N} robots con los mismos parametros aleatorizados en cada escenario (latencia, COF, velocidad real, MOI, error inicial). ` +
    `Variante del lazo de modulo: ${D.variant}. Cambia el kP arriba y compara.`;
  $("foot").textContent = `Simulacion en torch del modelo de tools/pid_sweep (cuerpo rigido plano, motor Kraken X60 FOC, circulo de friccion, latencia ` +
    `${Math.round(D.ranges.latency_s[0]*1000)}–${Math.round(D.ranges.latency_s[1]*1000)} ms, COF ${D.ranges.cof[0]}–${D.ranges.cof[1]}). ` +
    `Es una referencia para elegir kP; el ajuste final se hace en el robot real.`;

  // Escenarios
  const scBox = $("scenarios");
  D.scenarios.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.id = "sc-" + i; b.setAttribute("aria-pressed", String(i === sc));
    b.innerHTML = `<span></span><span class="kp"></span>`;
    b.children[0].textContent = s.label; b.children[1].textContent = `(${s.kp_t}, ${s.kp_r})`;
    b.onclick = () => { sc = i; scBox.querySelectorAll("button").forEach((x, j) => x.setAttribute("aria-pressed", String(j === i))); stats(); draw(); };
    scBox.appendChild(b);
  });
  $("v-grid").onclick = () => setView("grid");
  $("v-over").onclick = () => setView("over");
  function setView(v) { view = v; $("v-grid").setAttribute("aria-pressed", String(v === "grid")); $("v-over").setAttribute("aria-pressed", String(v === "over")); resize(); }
  $("play").onclick = () => { playing = !playing; syncPlay(); };
  function syncPlay() { $("play").textContent = playing ? "Pausa" : "Reproducir"; $("play").setAttribute("aria-pressed", String(!playing)); }
  $("speed").onchange = e => { speed = parseFloat(e.target.value); };
  $("scrub").oninput = e => { t = e.target.value / 1000 * tEnd; draw(); };

  function stats() {
    const runs = D.scenarios[sc].runs;
    const cnt = s => runs.filter(r => r.state === s).length;
    const fin = runs.filter(r => r.state === "ok").map(r => r.final_cm).sort((a, b) => a - b);
    const p95 = fin.length ? fin[Math.min(fin.length - 1, Math.floor(0.95 * fin.length))] : NaN;
    const items = [["", N, "robots simulados"], ["ok", cnt("ok"), "siguieron el path"], ["abort", cnt("aborto"), "abortaron"],
      ["bad", cnt("inestable"), "inestables"], ["", isNaN(p95) ? "–" : p95.toFixed(1) + " cm", "error final p95 (los que siguieron)"]];
    $("stats").innerHTML = "";
    for (const [cls, v, k] of items) {
      const d = document.createElement("div"); d.className = "stat " + cls;
      d.innerHTML = `<span class="v"></span><span class="k"></span>`;
      d.children[0].textContent = v; d.children[1].textContent = k; $("stats").appendChild(d);
    }
  }

  // Layout del lienzo: secciones por trayectoria.
  function resize() {
    const W = stage.clientWidth - 20, dpr = window.devicePixelRatio || 1;
    layout = []; let y = 0;
    const groups = D.trajectories.map((tr, j) => ({ j, ids: D.robots.map((r, i) => r.traj === j ? i : -1).filter(i => i >= 0) }));
    if (view === "grid") {
      const tile = Math.max(66, Math.min(118, Math.floor(W / Math.max(4, Math.floor(W / 92)))));
      const cols = Math.max(1, Math.floor(W / tile));
      for (const g of groups) {
        layout.push({ kind: "label", y, text: TRAJ_NAME[D.trajectories[g.j].name] || D.trajectories[g.j].name, n: g.ids.length });
        y += 22;
        g.ids.forEach((id, k) => layout.push({ kind: "tile", id, j: g.j, x: (k % cols) * tile, y: y + Math.floor(k / cols) * tile, w: tile - 4, h: tile - 4 }));
        y += Math.ceil(g.ids.length / cols) * tile + 10;
      }
    } else {
      const cols = W > 1000 ? 3 : W > 640 ? 2 : 1, pw = Math.floor(W / cols), ph = Math.round(pw * 0.62);
      groups.forEach((g, k) => {
        const x = (k % cols) * pw, yy = y + Math.floor(k / cols) * (ph + 30);
        layout.push({ kind: "label", y: yy, x, text: TRAJ_NAME[D.trajectories[g.j].name] || D.trajectories[g.j].name, n: g.ids.length });
        layout.push({ kind: "panel", j: g.j, ids: g.ids, x, y: yy + 22, w: pw - 8, h: ph });
      });
      y += Math.ceil(groups.length / cols) * (ph + 30);
    }
    cv.style.height = y + "px"; cv.width = Math.round(W * dpr); cv.height = Math.round(y * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function frame(run, tt) {  // pose interpolada
    const f = tt / FDT, n = run.x.length, i = Math.min(n - 1, Math.floor(f)), k = Math.min(n - 1, i + 1), a = Math.min(1, f - i);
    let dth = run.th[k] - run.th[i]; dth = Math.atan2(Math.sin(dth), Math.cos(dth));
    return [run.x[i] + a * (run.x[k] - run.x[i]), run.y[i] + a * (run.y[k] - run.y[i]), run.th[i] + a * dth];
  }
  function target(tr, tt) {
    const f = Math.min(tt, tr.total_time) / FDT, n = tr.x.length, i = Math.min(n - 1, Math.floor(f)), k = Math.min(n - 1, i + 1), a = Math.min(1, f - i);
    let dth = tr.theta[k] - tr.theta[i]; dth = Math.atan2(Math.sin(dth), Math.cos(dth));
    return [tr.x[i] + a * (tr.x[k] - tr.x[i]), tr.y[i] + a * (tr.y[k] - tr.y[i]), tr.theta[i] + a * dth];
  }
  function viewport(tr, r) {  // escala metros -> pixeles para encuadrar la trayectoria
    const m = 0.75, b = tr.bounds, cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
    const sw = Math.max(b[2] - b[0] + 2 * m, 3.0), sh = Math.max(b[3] - b[1] + 2 * m, 3.0);
    const s = Math.min(r.w / sw, r.h / sh);
    return { s, X: x => r.x + r.w / 2 + (x - cx) * s, Y: y => r.y + r.h / 2 - (y - cy) * s };
  }
  function robot(vp, p, color, alpha, ghost, outline) {
    const h = D.bumper_m / 2 * vp.s, x = vp.X(p[0]), y = vp.Y(p[1]);
    ctx.save(); ctx.translate(x, y); ctx.rotate(-p[2]); ctx.globalAlpha = alpha;
    if (ghost) { ctx.setLineDash([3, 3]); ctx.strokeStyle = COL.tape; ctx.lineWidth = 1; ctx.strokeRect(-h, -h, 2 * h, 2 * h); }
    else if (outline) {
      ctx.fillStyle = color; ctx.globalAlpha = alpha * 0.18; ctx.fillRect(-h, -h, 2 * h, 2 * h);
      ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.strokeRect(-h, -h, 2 * h, 2 * h);
      ctx.beginPath(); ctx.moveTo(h * 0.2, 0); ctx.lineTo(h, 0); ctx.stroke();
    } else {
      ctx.fillStyle = color; ctx.fillRect(-h, -h, 2 * h, 2 * h);
      ctx.fillStyle = COL.bg; ctx.beginPath(); ctx.moveTo(h, 0); ctx.lineTo(h * 0.25, -h * 0.55); ctx.lineTo(h * 0.25, h * 0.55); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function field(r, tr, vp) {
    ctx.fillStyle = COL.carpet; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.save(); ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    if (vp.s > 18) {  // rejilla de 1 m
      ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.beginPath();
      for (let gx = Math.floor((r.x - vp.X(0)) / vp.s); vp.X(gx) < r.x + r.w; gx++) { ctx.moveTo(Math.round(vp.X(gx)) + 0.5, r.y); ctx.lineTo(Math.round(vp.X(gx)) + 0.5, r.y + r.h); }
      for (let gy = Math.floor((vp.Y(0) - r.y - r.h) / vp.s); vp.Y(gy) > r.y; gy++) { ctx.moveTo(r.x, Math.round(vp.Y(gy)) + 0.5); ctx.lineTo(r.x + r.w, Math.round(vp.Y(gy)) + 0.5); }
      ctx.stroke();
    }
    ctx.strokeStyle = COL.tape; ctx.globalAlpha = 0.55; ctx.lineWidth = Math.max(1, vp.s * 0.04); ctx.beginPath();
    tr.x.forEach((x, i) => i ? ctx.lineTo(vp.X(x), vp.Y(tr.y[i])) : ctx.moveTo(vp.X(x), vp.Y(tr.y[i]))); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.restore();
  }
  function trail(vp, run, color, alpha) {
    const i1 = Math.min(run.x.length - 1, Math.floor(t / FDT)), i0 = Math.max(0, i1 - Math.round(1.2 / FDT));
    ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = i0; i <= i1; i++) i === i0 ? ctx.moveTo(vp.X(run.x[i]), vp.Y(run.y[i])) : ctx.lineTo(vp.X(run.x[i]), vp.Y(run.y[i]));
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  function draw() {
    const W = cv.width / (window.devicePixelRatio || 1), H = cv.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, W, H);
    const runs = D.scenarios[sc].runs;
    for (const L of layout) {
      if (L.kind === "label") {
        ctx.fillStyle = COL.fg; ctx.font = `600 13px ${C("--font-body")}`; ctx.textBaseline = "top";
        ctx.fillText(L.text, (L.x || 0) + 2, L.y + 3);
        const w = ctx.measureText(L.text).width; ctx.fillStyle = COL.muted; ctx.font = `12px ${C("--font-mono")}`;
        ctx.fillText(`${L.n} robots`, (L.x || 0) + w + 12, L.y + 4);
      } else if (L.kind === "tile") {
        const tr = D.trajectories[L.j], run = runs[L.id], vp = viewport(tr, L), col = COL[run.state];
        field(L, tr, vp);
        ctx.save(); ctx.beginPath(); ctx.rect(L.x, L.y, L.w, L.h); ctx.clip();
        robot(vp, target(tr, t), null, 0.9, true);
        trail(vp, run, col, 0.5);
        robot(vp, frame(run, t), col, 1, false);
        ctx.restore();
        ctx.strokeStyle = L.id === hover ? COL.fg : (run.state === "ok" ? COL.line : col);
        ctx.lineWidth = L.id === hover || run.state !== "ok" ? 2 : 1; ctx.strokeRect(L.x + 0.5, L.y + 0.5, L.w - 1, L.h - 1);
      } else if (L.kind === "panel") {
        const tr = D.trajectories[L.j], vp = viewport(tr, L);
        field(L, tr, vp);
        ctx.save(); ctx.beginPath(); ctx.rect(L.x, L.y, L.w, L.h); ctx.clip();
        for (const id of L.ids) trail(vp, runs[id], COL[runs[id].state], 0.25);
        for (const id of L.ids) robot(vp, frame(runs[id], t), COL[runs[id].state], id === hover ? 1 : 0.8, false, id !== hover);
        robot(vp, target(tr, t), null, 1, true);
        ctx.restore();
      }
    }
    $("time").textContent = `t = ${t.toFixed(2)} s`;
    $("scrub").value = Math.round(t / tEnd * 1000);
  }

  // Detalle al pasar el mouse
  stage.addEventListener("mousemove", e => {
    const rc = cv.getBoundingClientRect(), mx = e.clientX - rc.left, my = e.clientY - rc.top;
    let found = -1;
    for (const L of layout) {
      if (L.kind === "tile" && mx >= L.x && mx <= L.x + L.w && my >= L.y && my <= L.y + L.h) { found = L.id; break; }
      if (L.kind === "panel" && mx >= L.x && mx <= L.x + L.w && my >= L.y && my <= L.y + L.h) {
        const vp = viewport(D.trajectories[L.j], L); let best = 1e9;
        for (const id of L.ids) { const p = frame(D.scenarios[sc].runs[id], t), d = Math.hypot(vp.X(p[0]) - mx, vp.Y(p[1]) - my); if (d < best && d < 24) { best = d; found = id; } }
        break;
      }
    }
    hover = found; if (!playing) draw();
    if (found < 0) { tip.hidden = true; return; }
    const r = D.robots[found], run = D.scenarios[sc].runs[found];
    tip.innerHTML = `<h3></h3><dl></dl>`;
    tip.firstChild.textContent = `Robot ${found + 1} · `; const st = document.createElement("span");
    st.className = "state-" + run.state; st.textContent = STATE_NAME[run.state]; tip.firstChild.appendChild(st);
    const rows = [["Trayectoria", TRAJ_NAME[D.trajectories[r.traj].name] || ""], ["Latencia", r.latency_ms + " ms"], ["COF", r.cof],
      ["Velocidad real", r.speed_pct + " %"], ["MOI", r.moi + " kg·m²"], ["Altura CM", r.cg_h + " m"],
      ["Error inicial", `${r.init_cm} cm / ${r.init_deg}°`], ["Error maximo", run.max_cm + " cm"],
      ["Error final", `${run.final_cm} cm / ${run.final_deg}°`], ["Derrape", run.slip_pct + " % del path"]];
    for (const [k, v] of rows) { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; tip.lastChild.append(dt, dd); }
    tip.hidden = false;
    const sr = stage.getBoundingClientRect(); let x = e.clientX - sr.left + 14, y = e.clientY - sr.top + 14;
    if (x + 240 > sr.width) x -= 260; tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  stage.addEventListener("mouseleave", () => { hover = -1; tip.hidden = true; if (!playing) draw(); });

  let last = null;
  function tick(ts) {
    if (last !== null && playing) { t += (ts - last) / 1000 * speed; if (t > tEnd) t = 0; draw(); }
    last = ts; requestAnimationFrame(tick);
  }
  window.addEventListener("resize", resize);
  const h = location.hash.replace("#", "");
  if (h === "superpuestos") setView("over");
  const m = /^esc(\d+)$/.exec(h); if (m && D.scenarios[+m[1]]) document.getElementById("sc-" + m[1]).click();
  syncPlay(); stats(); resize(); requestAnimationFrame(tick);
})();
</script>
